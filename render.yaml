services:
  - type: web
    name: audio-guestbook
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: audio-guestbook-db
          property: connectionString
      - key: PGSSL
        value: "true"

databases:
  - name: audio-guestbook-db
    plan: free
